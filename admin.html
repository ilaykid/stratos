    <style id="stratos-vault-gate-css">
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-block-size: 100svh;
        background: #0b0d10;
        color: #f8fafc;
        font-family: 'Heebo', system-ui, sans-serif;
      }
      .vault-wrap {
        min-block-size: 100svh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background:
          radial-gradient(56% 48% at 50% 34%, rgba(197, 160, 89, 0.09) 0%, rgba(11, 13, 16, 0) 70%),
          #0b0d10;
      }
      .vault-card {
        inline-size: min(100%, 26.5rem);
        background: #14171d;
        border: 1px solid rgba(197, 160, 89, 0.34);
        border-radius: 1rem;
        padding: clamp(1.6rem, 4vw, 2.3rem);
        box-shadow: 0 28px 64px rgba(0, 0, 0, 0.65);
        display: grid;
        gap: 1.15rem;
      }
      .vault-brand {
        display: grid;
        justify-items: center;
        text-align: center;
        gap: 0.55rem;
      }
      .vault-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.22rem 0.68rem;
        border-radius: 999px;
        background: rgba(197, 160, 89, 0.14);
        border: 1px solid rgba(197, 160, 89, 0.36);
        color: #c5a059;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .vault-title {
        margin: 0;
        font-family: 'Frank Ruhl Libre', Georgia, serif;
        font-size: 1.65rem;
        font-weight: 400;
        color: #f8fafc;
      }
      .vault-desc {
        margin: 0;
        font-size: 0.9rem;
        line-height: 1.6;
        color: #9eadc2;
        text-align: center;
      }
      .vault-form {
        display: grid;
        gap: 0.95rem;
      }
      .vault-field {
        display: grid;
        gap: 0.42rem;
      }
      .vault-field label {
        font-size: 0.86rem;
        font-weight: 500;
        color: #e2e8f0;
      }
      .vault-input-wrap {
        position: relative;
        display: flex;
        align-items: center;
        direction: ltr;
      }
      .vault-input {
        inline-size: 100%;
        min-block-size: 2.85rem;
        padding-block: 0.55rem;
        padding-inline: 0.85rem 3.5rem;
        background: #0b0d10;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 0.55rem;
        color: #f8fafc;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.95rem;
        direction: ltr;
        text-align: left;
      }
      .vault-input:focus-visible {
        outline: 2px solid #c5a059;
        outline-offset: 2px;
        border-color: #c5a059;
      }
      .vault-eye-btn {
        position: absolute;
        inset-inline-end: 0.35rem;
        inline-size: 2.35rem;
        block-size: 2.35rem;
        border: 0;
        border-radius: 0.4rem;
        background: transparent;
        color: #9eadc2;
        cursor: pointer;
        font-size: 0.78rem;
        font-family: inherit;
      }
      .vault-eye-btn:hover,
      .vault-eye-btn:focus-visible {
        color: #c5a059;
        outline: 2px solid #c5a059;
      }
      .vault-remember {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        font-size: 0.83rem;
        color: #9eadc2;
        cursor: pointer;
      }
      .vault-remember input {
        inline-size: 1.05rem;
        block-size: 1.05rem;
        accent-color: #c5a059;
      }
      .vault-error {
        margin: 0;
        padding: 0.62rem 0.8rem;
        border-radius: 0.5rem;
        background: rgba(239, 68, 68, 0.14);
        border: 1px solid rgba(248, 113, 113, 0.42);
        color: #fecaca;
        font-size: 0.85rem;
      }
      .vault-btn {
        min-block-size: 2.9rem;
        border: 0;
        border-radius: 0.55rem;
        background: linear-gradient(135deg, #d4b26e 0%, #b88f44 100%);
        color: #0b0d10;
        font-family: inherit;
        font-size: 0.96rem;
        font-weight: 600;
        cursor: pointer;
        transition: filter 0.2s ease;
      }
      .vault-btn:hover { filter: brightness(1.07); }
      .vault-btn:disabled { opacity: 0.65; cursor: wait; }
      .vault-btn:focus-visible { outline: 2px solid #f8fafc; outline-offset: 2px; }
      .vault-back {
        justify-self: center;
        color: #9eadc2;
        font-size: 0.84rem;
        text-decoration: none;
        padding: 0.35rem 0.6rem;
        border-radius: 0.4rem;
      }
      .vault-back:hover, .vault-back:focus-visible {
        color: #c5a059;
        outline: 2px solid #c5a059;
      }
    </style>
  </head>

      <section class="vault-card" aria-labelledby="vault-heading">

            <path d="M8.73 71.6L8.73 96.6Q8.73 99.6 11.33 101.1L57.4 127.7Q60 129.2 62.6 127.7L108.67 101.1Q111.27 99.6 111.27 96.6L111.27 86.65Q111.27 83.65 108.67 82.15L60.65 54.43L60.65 70.36L97.47 91.62L60 113.25L22.53 91.62L22.53 79.57Z" fill="#CBD5E1"/>

          <span class="vault-badge">מוצפן AES-256 · מורשים בלבד</span>
          <h1 class="vault-title" id="vault-heading">מערכת הניהול של STRATOS</h1>
          <p class="vault-desc">הגישה למחירי העלות, המלאי ומחולל הצעות המחיר חסומה ומוצפנת למנהלי המותג בלבד.</p>
        </div>

        <form class="vault-form" id="vault-unlock-form">
          <div class="vault-field">
            <label for="vault-pass-input">סיסמת מנהלים</label>
            <div class="vault-input-wrap">
              <input
                type="password"
                id="vault-pass-input"
                class="vault-input"
                required
                autocomplete="current-password"
                placeholder="••••••••••••"
              />
              <button type="button" class="vault-eye-btn" id="vault-toggle-vis" aria-label="הצגת או הסתרת הסיסמה">הצג</button>
            </div>
          </div>

          <label class="vault-remember">
            <input type="checkbox" id="vault-remember-tab" checked />
            <span>שמור גישה פתוחה בלשונית זו בלבד (עד סגירת הדפדפן)</span>
          </label>

          <p class="vault-error" id="vault-error-msg" role="alert" hidden>הסיסמה שהוזנה שגויה. הגישה למערכת חסומה.</p>

          <button type="submit" class="vault-btn" id="vault-submit-btn">פתיחת מערכת הניהול</button>
        </form>

        <a class="vault-back" href="./index.html">← חזרה לאתר הראשי</a>
      </section>
    </main>

    <script>
      (function () {
        const SESSION_KEY = 'stratos-vault-k-v1';
        const env = JSON.parse(document.getElementById('stratos-vault-envelope').textContent);
        const form = document.getElementById('vault-unlock-form');
        const passInput = document.getElementById('vault-pass-input');
        const visBtn = document.getElementById('vault-toggle-vis');
        const rememberBox = document.getElementById('vault-remember-tab');
        const errEl = document.getElementById('vault-error-msg');
        const submitBtn = document.getElementById('vault-submit-btn');
        let failedAttempts = 0;

        function b64ToBytes(b64) {
          const bin = atob(b64);
          const out = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
          return out;
        }

        function bytesToB64(bytes) {
          let bin = '';
          for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
          return btoa(bin);
        }

        async function deriveRawKey(passphrase, saltBytes) {
          const baseKey = await crypto.subtle.importKey(
            'raw',
            new TextEncoder().encode(passphrase),
            'PBKDF2',
            false,
            ['deriveBits']
          );
          const bits = await crypto.subtle.deriveBits(
            { name: 'PBKDF2', salt: saltBytes, iterations: env.iter, hash: 'SHA-256' },
            baseKey,
            256
          );
          return new Uint8Array(bits);
        }

        async function decryptWithRawKey(rawKeyBytes) {
          const aesKey = await crypto.subtle.importKey('raw', rawKeyBytes, { name: 'AES-GCM' }, false, ['decrypt']);
          const plainBuf = await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: b64ToBytes(env.i) },
            aesKey,
            b64ToBytes(env.c)
          );
          return JSON.parse(new TextDecoder().decode(plainBuf));
        }

        function mountDecryptedApp(payload) {
          window.__STRATOS_VAULT_LOCK__ = function () {
            try { sessionStorage.removeItem(SESSION_KEY); } catch {}
            window.location.reload();
          };
          document.getElementById('stratos-vault-gate-css')?.remove();
          const styleEl = document.createElement('style');
          styleEl.id = 'stratos-admin-decrypted-css';
          styleEl.textContent = payload.css;
          document.head.appendChild(styleEl);

          document.title = 'STRATOS · מערכת ניהול תמחור, מלאי חלקים והצעות מחיר';
          document.body.dataset.clientMode = 'false';
          document.body.innerHTML = payload.bodyHtml;

          const scriptEl = document.createElement('script');
          scriptEl.textContent = payload.js;
          document.body.appendChild(scriptEl);
        }

        visBtn?.addEventListener('click', function () {
          const isPwd = passInput.type === 'password';
          passInput.type = isPwd ? 'text' : 'password';
          visBtn.textContent = isPwd ? 'הסתר' : 'הצג';
        });

        // Auto-unlock if valid derived key exists in current browser tab sessionStorage
        (async function trySessionAutoUnlock() {
          try {
            const cached = sessionStorage.getItem(SESSION_KEY);
            if (!cached) {
              passInput?.focus();
              return;
            }
            const parsed = JSON.parse(cached);
            if (parsed.s !== env.s) {
              sessionStorage.removeItem(SESSION_KEY);
              passInput?.focus();
              return;
            }
            const payload = await decryptWithRawKey(b64ToBytes(parsed.k));
            mountDecryptedApp(payload);
          } catch {
            try { sessionStorage.removeItem(SESSION_KEY); } catch {}
            passInput?.focus();
          }
        })();

        form?.addEventListener('submit', async function (e) {
          e.preventDefault();
          errEl.hidden = true;
          submitBtn.disabled = true;
          submitBtn.textContent = 'מפענח הצפנה...';

          try {
            if (failedAttempts > 0) {
              await new Promise((r) => setTimeout(r, Math.min(4000, failedAttempts * 700)));
            }
            const rawKey = await deriveRawKey(passInput.value, b64ToBytes(env.s));
            const payload = await decryptWithRawKey(rawKey);
            if (rememberBox?.checked) {
              try {
                sessionStorage.setItem(SESSION_KEY, JSON.stringify({ s: env.s, k: bytesToB64(rawKey) }));
              } catch {}
            }
            mountDecryptedApp(payload);
          } catch {
            failedAttempts += 1;
            errEl.hidden = false;
            submitBtn.disabled = false;
            submitBtn.textContent = 'פתיחת מערכת הניהול';
            passInput.select();
          }
        });
      })();
    </script>
  </body>
</html>
